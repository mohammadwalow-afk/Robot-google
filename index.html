<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#060913" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="WALOW CAD" />
<title>WALOW CAD ULTRA</title>

<!-- أيقونة التطبيق للشاشة الرئيسية -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2310b981'/%3E%3Ctext x='50' y='66' font-size='52' font-weight='900' fill='%23060913' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2310b981'/%3E%3Ctext x='50' y='66' font-size='52' font-weight='900' fill='%23060913' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E" />

<!-- تحميل مكتبات 3D الأساسية فقط بدون خطوط ثقيلة -->
<script src="https://cloudflare.com"></script>
<script src="https://jsdelivr.net"></script>
<script src="https://jsdelivr.net"></script>

<style>
:root{--bg:#060913;--panel:#0d1428;--blue:#3b82f6;--purple:#8b5cf6;--green:#10b981;--amber:#f59e0b;--txt:#f1f5f9;--mut:#94a3b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);overflow-x:hidden}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.glass{background:rgba(13,20,40,.94);border:1px solid rgba(139,92,246,.3);border-radius:14px}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:40;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:0;border-width:0 0 1px 0}
.logo{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;color:#060913;background:linear-gradient(135deg,#10b981,#3b82f6);flex-shrink:0}
h1{font-size:14px;margin:0;font-weight:900}
.sub{font-size:10px;color:#6ee7b7}
.model-pill{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.45);border-radius:10px;padding:3px 8px;display:flex;align-items:center;gap:5px;font-size:10.5px;color:#6ee7b7}
.pulse{width:7px;height:7px;border-radius:50%;background:#10b981}
.btn{cursor:pointer;border:1px solid rgba(148,163,184,.25);background:#1e293b;color:var(--txt);border-radius:9px;padding:7px 10px;font:700 11.5px inherit;display:inline-flex;align-items:center;gap:4px}
.btn.pri{background:linear-gradient(135deg,#2563eb,#7c3aed);border:none;color:#fff}
.btn.grn{background:rgba(16,185,129,.2);border-color:rgba(16,185,129,.5);color:#6ee7b7}
.btn.amb{background:rgba(245,158,11,.18);border-color:rgba(245,158,11,.5);color:#fcd34d}
.btn.on{background:rgba(139,92,246,.5);border-color:#a78bfa;color:#fff}
main{max-width:1100px;margin:0 auto;padding:8px;display:flex;flex-direction:column;gap:10px}
.pad{padding:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.between{justify-content:space-between}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.model-card{flex:0 0 auto;min-width:140px;cursor:pointer;padding:8px 10px;border-radius:10px;background:#020617;border:1px solid rgba(99,102,241,.35)}
.model-card.act{border-color:#10b981;background:rgba(16,185,129,.15)}
.model-card b{display:block;font-size:12px}.model-card small{color:var(--mut);font-size:10px}
input[type=text],input[type=password],select{width:100%;background:#020617;border:1px solid rgba(59,130,246,.4);border-radius:9px;color:#fff;padding:8px 10px;font:12.5px inherit}
label{font-size:10.5px;color:var(--mut)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tab{padding:8px 4px;text-align:center;font-weight:700;font-size:11px;cursor:pointer;border-radius:10px;color:#cbd5e1}
.tab.act{background:linear-gradient(135deg,rgba(37,99,235,.45),rgba(16,185,129,.35));border-color:#10b981;color:#fff}
#viewWrap{position:relative}
#viewport3d{width:100%;height:54vh;min-height:300px;border-radius:12px;overflow:hidden;background:#050811;touch-action:none}
#hudTop{position:absolute;top:8px;right:8px;left:8px;pointer-events:none;display:flex;justify-content:space-between;gap:6px}
.hudBox{background:rgba(6,9,19,.88);border:1px solid rgba(59,130,246,.4);border-radius:8px;padding:5px 8px;font-size:10.5px}
#readout{position:absolute;bottom:8px;right:8px;background:rgba(6,9,19,.88);border:1px solid rgba(16,185,129,.45);border-radius:8px;padding:4px 8px;font-size:10.5px;pointer-events:none;color:#6ee7b7}
input[type=range]{width:100%;accent-color:#10b981}
.bar{background:#020617;border:1px solid rgba(99,102,241,.28);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{color:#6ee7b7;text-align:right;padding:6px;border-bottom:1px solid rgba(16,185,129,.3);background:#0d1428}
td{padding:6px;border-bottom:1px solid #1e293b}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:14px}
.modal .glass{max-width:420px;width:100%;padding:14px;display:flex;flex-direction:column;gap:10px}
.spin{width:36px;height:36px;border:3px solid #3b82f6;border-top-color:#10b981;border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="glass">
  <div class="row" style="gap:8px;flex-wrap:nowrap">
    <div class="logo">W</div>
    <div>
      <h1>WALOW CAD <span style="font-size:9px;padding:1px 6px;border-radius:99px;background:rgba(16,185,129,.25);color:#6ee7b7">FAST</span></h1>
      <div class="sub">يعمل بدون إنترنت • قياسات mm • تصادم</div>
    </div>
  </div>
  <div class="row" style="flex-wrap:nowrap">
    <div class="model-pill mono">
      <span class="pulse" id="modelDot"></span>
      <span id="activeModelLabel">gemini-3.8-flash</span>
    </div>
    <button class="btn grn" id="installBtn" onclick="triggerInstallPrompt()">📲 تثبيت</button>
    <button class="btn amb" onclick="openApiModal()">🔑</button>
  </div>
</header>

<main>
  <!-- التوليد بالذكاء الاصطناعي -->
  <section class="glass pad" style="display:flex;flex-direction:column;gap:6px">
    <div class="row between">
      <b style="font-size:12.5px;color:#6ee7b7">✨ صمّم أي آلة بالوصف (تحويل تلقائي ذكي)</b>
      <span id="keyHint" class="mono" style="font-size:10px"></span>
    </div>
    <div class="row" style="flex-wrap:nowrap">
      <input type="text" id="promptInput" placeholder="مثال: محرك 4 سلندر، نظام تعليق، ذراع روبوت..." />
      <button class="btn pri" onclick="buildWithAIAutoFallback()" style="white-space:nowrap">⚡ صمّم</button>
    </div>
  </section>

  <!-- النماذج الجاهزة السريعة -->
  <section class="glass pad" style="display:flex;flex-direction:column;gap:6px">
    <b style="font-size:12px;color:#93c5fd">🧰 نماذج هندسية فورية (بدون إنترنت)</b>
    <div class="chips" id="presetChips"></div>
  </section>

  <div id="loadingBox" class="glass pad hidden" style="text-align:center">
    <div class="spin"></div>
    <p id="loadingStatusText" style="font-weight:700;color:#6ee7b7;margin:6px 0 2px;font-size:12.5px">جاري التصميم...</p>
    <p id="loadingSubText" class="mono" style="font-size:10.5px;color:var(--mut);margin:0"></p>
  </div>

  <div class="tabs">
    <div class="tab glass act" id="btn-tab3d" onclick="switchTab('tab3d')">🧊 المحاكي 3D</div>
    <div class="tab glass" id="btn-tabBom" onclick="switchTab('tabBom')">🔩 القطع</div>
    <div class="tab glass" id="btn-tabPhys" onclick="switchTab('tabPhys')">⚙️ الفيزياء</div>
    <div class="tab glass" id="btn-tabHelp" onclick="switchTab('tabHelp')">📲 التثبيت</div>
  </div>

  <div id="tab3d" class="tab-content glass pad" style="display:flex;flex-direction:column;gap:8px">
    <div id="viewWrap">
      <div id="viewport3d"></div>
      <div id="hudTop">
        <div class="hudBox">
          <div style="color:#93c5fd;font-weight:700">📐 الأبعاد (mm)</div>
          <div id="dimTotal" class="mono" style="font-weight:700">W: 0 × H: 0 × D: 0</div>
          <div id="dimSelected" style="color:#6ee7b7;font-size:10px">المس قطعة لقياسها</div>
        </div>
        <div class="hudBox" style="max-width:180px">
          <b id="stepTag" style="color:#c4b5fd">جاهز</b>
        </div>
      </div>
      <div id="readout" class="mono">RPM: 80</div>
    </div>

    <div class="bar">
      <div class="row">
        <button class="btn pri" onclick="asmStart()">▶ تركيب تلقائي</button>
        <button class="btn grn" onclick="asmComplete()">✔ مكتمل</button>
        <button class="btn amb" id="physBtn" onclick="toggleCollisionPhysics()">💥 تصادم</button>
        <button class="btn" onclick="dropTest()">⬇️ سقوط</button>
        <button class="btn" id="cutBtn" onclick="toggleCutaway()">🔪 مقطع</button>
      </div>
      <input type="range" id="asmProgress" min="0" max="1000" value="1000" oninput="asmScrub(this.value)" />
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div>
          <label>السرعة: <span class="mono" id="rpmVal">80 RPM</span></label>
          <input type="range" id="rpmRange" min="0" max="300" value="80" oninput="S.rpm=Number(this.value);$('rpmVal').textContent=this.value+' RPM'" />
        </div>
        <div>
          <label>التفكيك: <span class="mono" id="exVal">0%</span></label>
          <input type="range" id="exRange" min="0" max="100" value="0" oninput="setExplode(this.value)" />
        </div>
      </div>
      <div id="cutControls" class="hidden">
